[core/cli]
depends_libraries = ['unitorch_microsoft.models.vllm']
task_name = core/task/supervised
from_ckpt_dir = ./cache
cache_dir = ./cache
test_file = ./test.tsv

# model
[core/model/vllm/generation/qwen3_vl]
pretrained_name = qwen3-vl-2b-instruct-lp-image-relevance
max_gen_seq_length = 32
tensor_parallel_size = 1
pipeline_parallel_size = 1
gpu_memory_utilization = 0.90
max_model_len = 5120                       # context window limit; None = inferred from model config
max_num_seqs = 32
max_num_images = 1
enable_prefix_caching = True
dtype = bfloat16                                  # auto | float16 | bfloat16 | float32
enforce_eager = False                         # disable CUDA graph capture (saves VRAM, slower)
# quantization = awq                          # awq | gptq | fp8 | None

# dataset
[core/dataset/ast]
# FinalUrl	ImgUrl	Label	doc	Base64
names = ['final_url', 'img_url', 'label', 'doc', 'base64']

[core/dataset/ast/test]
data_files = ${core/cli:test_file}
preprocess_functions = [
    '''
    core/process/object/inputs(
      prompt=core/process/qwen_vl/chat_template(
        [
            {
                "role": "user",
                "content": [
                    {
                        "type": "image"
                    },
                    {"type": "text", "text": "Please evaluate the relevance between an image and a URL landing page (LP). Answer with only Good, Fair, or Bad. LP: {0} Output:".format(doc)},
                ],
            }
        ]
      ),
      images=core/process/image/resize_longest_edge(core/process/image/read(base64), size=448)
    )
    
    '''
  ]

# process
[core/process/qwen_vl]
pretrained_name = qwen3-vl-2b-instruct
max_seq_length = 5120
max_gen_seq_length = 32

[core/process/image]
image_type = base64

[core/writer/csv]
escapechar = \

# task
[core/task/supervised]
model = core/model/vllm/generation/qwen3_vl
dataset = core/dataset/ast
output_header = ['final_url', 'img_url', 'label', 'doc']
postprocess_fn = core/postprocess/qwen_vl/detokenize
writer = core/writer/csv

from_ckpt_dir = ${core/cli:from_ckpt_dir}
output_path = ${core/cli:cache_dir}/output.txt
test_batch_size = 1